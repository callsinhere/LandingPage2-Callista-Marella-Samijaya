<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- TITLE -->
        <div class="title">
            <h1>Basic Calculator</h1>
            <p>Simple JavaScript Application</p>
        </div>


        <!-- CALCULATOR -->
        <div class="calculator">

            <!-- DISPLAY -->
            <div class="display">

                <div id="previous"></div>

                <div id="current">0</div>

                <div id="error"></div>

            </div>


            <!-- BUTTONS -->
            <div class="buttons">

                <!-- Row 1 -->
                <button class="clear" onclick="clearCalculator()">
                    AC
                </button>

                <button class="delete" onclick="deleteNumber()">
                    DEL
                </button>

                <button class="operator" onclick="chooseOperator('/')">
                    ÷
                </button>

                <button class="operator" onclick="chooseOperator('*')">
                    ×
                </button>


                <!-- Row 2 -->
                <button onclick="appendNumber('7')">
                    7
                </button>

                <button onclick="appendNumber('8')">
                    8
                </button>

                <button onclick="appendNumber('9')">
                    9
                </button>

                <button class="operator" onclick="chooseOperator('-')">
                    −
                </button>


                <!-- Row 3 -->
                <button onclick="appendNumber('4')">
                    4
                </button>

                <button onclick="appendNumber('5')">
                    5
                </button>

                <button onclick="appendNumber('6')">
                    6
                </button>

                <button class="operator" onclick="chooseOperator('+')">
                    +
                </button>


                <!-- Row 4 -->
                <button onclick="appendNumber('1')">
                    1
                </button>

                <button onclick="appendNumber('2')">
                    2
                </button>

                <button onclick="appendNumber('3')">
                    3
                </button>

                <button class="equal" onclick="calculate()">
                    =
                </button>


                <!-- Row 5 -->
                <button class="zero" onclick="appendNumber('0')">
                    0
                </button>

                <button onclick="appendNumber('.')">
                    .
                </button>

            </div>

        </div>

        <p class="footer">
            Built with HTML, CSS & JavaScript
        </p>

    </div>


    <script src="script.js"></script>

</body>
</html>
